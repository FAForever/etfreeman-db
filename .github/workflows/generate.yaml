name: Generate Unit Data

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout etfreeman-db
        uses: actions/checkout@v4
        with:
          repository: FAForever/etfreeman-db
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate unit data from FAF repos
        run: pnpm run generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload generated data
        uses: actions/upload-artifact@v4
        with:
          name: etfreeman-db-generated-data
          path: src/public/data/*.json
          retention-days: 1
