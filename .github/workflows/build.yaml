name: Build

on:
  workflow_dispatch:
  workflow_call:
  repository_dispatch:
    types: [faf_blueprints_updated]

permissions:
  contents: read

jobs:
  generate:
    uses: ./.github/workflows/generate.yaml

  build:
    runs-on: ubuntu-latest
    needs: generate
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: FAForever/etfreeman-db
          ref: main

      - name: Download generated data
        uses: actions/download-artifact@v4
        with:
          name: etfreeman-db-generated-data
          path: src/public/data

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test

      - name: Build Vue app
        run: pnpm run build
        env:
          GITHUB_ACTIONS: true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: etfreeman-db-dist
          path: './dist'
          retention-days: 1
          include-hidden-files: true